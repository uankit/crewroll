name: Production checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: airmesh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_AIRMESH_TRANSPORT: relay
      EXPO_PUBLIC_AIRMESH_RELAY_URL: wss://relay.invalid/v1/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      - run: npm ci
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: relay
      - run: npx expo install --check
      - run: npx --yes expo-doctor@1.20.1
      - run: npm run test:release-env
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
        working-directory: relay
      - run: npm run verify:bundle
