plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.uankit53.crewroll'
version = '0.1.0'

android {
  namespace 'com.uankit53.crewroll.transfer'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Reviewed, hash-locked artifacts; see Vendor/native-crypto-lock.json.
  implementation files('Vendor/lazysodium-android-5.2.0.aar')
  implementation files('Vendor/jna-5.17.0.aar')
}
